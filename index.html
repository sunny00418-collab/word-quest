<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Word Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b1e; --bg2:#15123a; --panel:#1c1846; --panel2:#251f5c; --line:#3a3380;
  --cyan:#2ef2ff; --pink:#ff3fa4; --yellow:#ffd23f; --green:#3cff8f; --red:#ff5a6e;
  --purple:#9b5cff; --orange:#ff8a3d; --text:#f2f0ff; --muted:#a9a3d9;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --body:"Nunito","PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh}
body{
  background:
    radial-gradient(circle at 20% -10%, #3b1d7a 0%, transparent 45%),
    radial-gradient(circle at 110% 30%, #0f3d6e 0%, transparent 40%),
    linear-gradient(transparent 95%, rgba(46,242,255,.06) 95%) 0 0/100% 28px,
    var(--bg);
  background-attachment:fixed;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;color:inherit}
.hidden{display:none!important}
#app{max-width:760px;margin:0 auto;padding:16px 16px 60px;padding-top:max(16px,env(safe-area-inset-top))}
.pixel{font-family:var(--pixel);letter-spacing:.5px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.card h3{font-family:var(--pixel);font-size:11px;color:var(--cyan);margin:0 0 12px;letter-spacing:1px}

/* ---------- header ---------- */
.logo{text-align:center;margin:8px 0 18px}
.logo .t1{font-family:var(--pixel);font-size:28px;line-height:1.3;color:var(--yellow);
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 rgba(0,0,0,.5)}
.logo .t2{font-size:15px;color:var(--muted);margin-top:8px;font-weight:800}

/* ---------- player card ---------- */
.player{display:flex;gap:14px;align-items:center}
.avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--pink));
  display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;border:2px solid #fff3}
.pinfo{flex:1;min-width:0}
.plv{font-family:var(--pixel);font-size:12px;color:var(--yellow)}
.ptitle{font-weight:900;font-size:20px;margin:4px 0 6px}
.xpbar{height:14px;background:#0008;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:8px;transition:width .6s}
.xptxt{font-size:12px;color:var(--muted);margin-top:4px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:#0005;border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:11px;color:var(--muted);font-weight:800}

/* ---------- unit chips ---------- */
.tsec{margin-bottom:12px}
.thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.thead b{font-weight:900;font-size:16px}
.btn-link{background:none;color:var(--cyan);font-weight:800;font-size:14px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0006;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;color:var(--muted);text-align:left;min-width:92px}
.chip small{display:block;font-size:11px;margin-top:2px;opacity:.85}
.chip.on{border-color:var(--cyan);color:var(--text);background:rgba(46,242,255,.12)}
.chip.on.f{border-color:var(--pink);background:rgba(255,63,164,.13)}
.selinfo{font-size:13px;color:var(--muted);font-weight:800;margin-top:6px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;
  font-weight:900;font-size:18px;margin-bottom:10px;box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn small{font-weight:800;font-size:13px;opacity:.85}
.b-start{background:linear-gradient(180deg,#ffe066,var(--yellow));color:#2a1a00}
.b-cont{background:linear-gradient(180deg,#6dfbb0,var(--green));color:#00301a}
.b-gym{background:linear-gradient(180deg,#ff7cc0,var(--pink));color:#fff}
.b-exam{background:linear-gradient(180deg,#b78bff,var(--purple));color:#fff}
.b-ghost{background:var(--panel2);color:var(--text);border:2px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin-bottom:0}
.row-sm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn-sm{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px}
.badge-n{background:#fff;color:var(--pink);border-radius:10px;padding:1px 8px;font-size:14px}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qlabel{flex:1;font-family:var(--pixel);font-size:10px;color:var(--cyan);line-height:1.5}
.qscore{font-weight:900;font-size:16px;color:var(--green)}
.pbar{height:10px;background:#0007;border-radius:6px;overflow:hidden;margin-bottom:10px}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .4s}
.qcount{font-size:14px;color:var(--muted);font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:900;padding:3px 10px;border-radius:20px;color:#000}
.t-EN_CN{background:var(--cyan)} .t-CN_EN{background:var(--yellow)} .t-DEF{background:#b78bff}
.t-FILL{background:var(--green)} .t-INFL{background:var(--orange)}
.qcard{text-align:center;padding:22px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ask{font-size:15px;color:var(--muted);font-weight:800}
.big{font-size:38px;font-weight:900;line-height:1.2;word-break:break-word}
.big.zh{font-size:32px}
.pos{font-size:15px;color:var(--cyan);font-weight:800;font-style:italic}
.def{font-size:22px;font-weight:800;line-height:1.45}
.sent{font-size:21px;font-weight:700;line-height:1.6;text-align:left}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--yellow);color:var(--yellow);text-align:center}
.zhhint{font-size:16px;color:var(--muted);font-weight:700;text-align:left;border-top:1px dashed var(--line);padding-top:10px}
.spk{background:var(--panel2);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:20px;vertical-align:middle;margin-left:6px}
.hint-btn{background:none;border:2px dashed var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;align-self:center}
.hintbox{font-size:17px;color:var(--yellow);font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:16px 10px;min-height:70px;font-size:20px;font-weight:800;
  box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.right{background:#0f5a37;border-color:var(--green);color:#fff}
.opt.wrong{background:#5a1020;border-color:var(--red);color:#fff;animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:14px;border-radius:16px;padding:16px;border:2px solid;animation:pop .25s}
.fb.ok{background:rgba(60,255,143,.1);border-color:var(--green)}
.fb.bad{background:rgba(255,90,110,.1);border-color:var(--red)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.fb-t{font-weight:900;font-size:19px;margin-bottom:8px}
.fb-w{font-size:20px;font-weight:900;margin-bottom:6px}
.fb-w i{color:var(--cyan);font-size:15px;margin:0 6px}
.fb-s{font-size:17px;line-height:1.55;font-weight:700}
.fb-s b{color:var(--yellow)}
.fb-zh{font-size:15px;color:var(--muted);font-weight:700;margin-top:4px}
.fb-fix{margin-top:10px;font-weight:900;color:var(--yellow);font-size:17px}
.fb .btn{margin:14px 0 0}

/* ---------- result ---------- */
.res-stars{font-size:54px;text-align:center;letter-spacing:6px;margin:6px 0}
.res-score{font-family:var(--pixel);font-size:30px;text-align:center;color:var(--yellow);margin:8px 0}
.res-msg{text-align:center;font-weight:900;font-size:19px;margin-bottom:12px}
.res-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:800}
.res-row:last-child{border:none}
.miss-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:800}
.tf-h{font-weight:900;color:var(--yellow);margin:12px 0 2px;font-size:14px}
.tf-h:first-of-type{margin-top:0}
.tf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.tf b{display:block;font-weight:900;font-size:16px}
.tf .tf-f{color:var(--green)}
.tf small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.tf>span{color:var(--orange);font-weight:800;font-size:13px;text-align:right}
.miss-item span{color:var(--muted);font-weight:700;text-align:right}

/* ---------- trophies / book / exam ---------- */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tro{background:#0005;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.tro .ic{font-size:36px}
.tro b{display:block;margin:6px 0 2px;font-weight:900}
.tro span{font-size:12px;color:var(--muted);font-weight:700}
.tro.locked{opacity:.35;filter:grayscale(1)}
.tro.got{border-color:var(--yellow);box-shadow:0 0 14px rgba(255,210,63,.3)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wc{background:#0005;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.wc b{display:block;font-size:16px;font-weight:900}
.wc span{font-size:13px;color:var(--muted);font-weight:700}
.wc .st{font-size:14px;margin-top:4px;color:var(--yellow);letter-spacing:2px}
.wc.m3{border-color:var(--yellow)}
.ex-item{padding:10px 0;border-bottom:1px dashed var(--line)}
.ex-item:last-child{border:none}
.ex-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-top b{font-size:17px;font-weight:900}
.ex-top .cnt{color:var(--red);font-weight:900}
.ex-sub{font-size:13px;color:var(--muted);font-weight:700;margin:3px 0 5px}
.ex-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ex-tags .tag{font-size:11px;padding:2px 8px}
.status{font-size:12px;font-weight:900;margin-left:auto}
.status.fixed{color:var(--green)} .status.act{color:var(--pink)}
.back{margin-bottom:12px}
.empty{text-align:center;color:var(--muted);font-weight:800;padding:20px}
.note{font-size:14px;color:var(--muted);font-weight:700;line-height:1.5;margin:0 0 12px}

/* ---------- ready check ---------- */
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;transform:none}
.ready-msg{text-align:center;line-height:1.6}
.ready-msg p{margin:0 0 12px}
.ready-msg b{display:block;font-size:19px;font-weight:900}
.ready-msg span{display:block;font-size:16px;color:var(--yellow);font-weight:800}
.name-in{width:100%;box-sizing:border-box;font:inherit;font-size:22px;font-weight:900;text-align:center;padding:12px;border-radius:12px;border:3px solid var(--muted);background:transparent;color:inherit}
.rk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#0005;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rk .box{width:30px;height:30px;border-radius:8px;border:3px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#00301a}
.rk.on{border-color:var(--green);background:rgba(60,255,143,.1)}
.rk.on .box{background:var(--green);border-color:var(--green)}
.rk.on .box::after{content:"✓"}
.rk b{display:block;font-weight:900;font-size:16px}
.rk span{display:block;font-size:14px;color:var(--muted);font-weight:700}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#streak{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:40;background:linear-gradient(135deg,var(--orange),var(--red));
  border-radius:20px;padding:8px 14px;font-weight:900;font-size:18px;box-shadow:0 0 18px rgba(255,138,61,.7);animation:flame .6s infinite alternate}
@keyframes flame{from{transform:scale(1)}to{transform:scale(1.08)}}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:60;pointer-events:none;opacity:0}
#banner.show{animation:bn 1.8s ease-out forwards}
#banner .bn-main{font-family:var(--pixel);font-size:30px;color:var(--yellow);text-shadow:3px 3px 0 var(--pink),0 0 30px rgba(255,210,63,.8);line-height:1.4;padding:0 10px}
#banner .bn-sub{font-weight:900;font-size:20px;margin-top:10px;text-shadow:0 2px 8px #000}
@keyframes bn{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#fff;color:#1b1340;
  font-weight:900;padding:12px 20px;border-radius:14px;z-index:70;transition:transform .3s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:520px){
  .logo .t1{font-size:20px}
  .big{font-size:30px} .big.zh{font-size:26px}
  .def{font-size:19px} .sent{font-size:18px}
  .opt{font-size:17px;min-height:62px}
  .stats{grid-template-columns:repeat(2,1fr)}
  #banner .bn-main{font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <section id="ready" class="hidden"></section>
  <section id="home"></section>
  <section id="quiz" class="hidden"></section>
  <section id="result" class="hidden"></section>
  <section id="trophies" class="hidden"></section>
  <section id="book" class="hidden"></section>
  <section id="exam" class="hidden"></section>
</div>
<div id="streak" class="hidden"></div>
<canvas id="fx"></canvas>
<div id="banner"></div>
<div id="toast"></div>

<script>
/* =========================================================
   Word Quest — Grade 4 vocabulary game
   Units: Teacher F Set 1–6, Teacher C Week 1–8
   ========================================================= */

// ===== TELEGRAM (留空 = 不發送) =====
// Token 存在 Google Apps Script 轉發程式裡（word_quest_telegram_relay.gs），這裡只放它的網址
const RELAY_URL = "https://script.google.com/macros/s/AKfycbwDyLcBw-2DHSyrQ7Uc3eZOCeUGVb6F9RBvgXbUxqCkjGrREH2JQtCaa0TyB0mB40352w/exec";   // Apps Script「Word Quest Telegram Relay」網頁應用程式網址

// ===== SETTINGS =====
const STORE_KEY  = "jerry_wordquest_v1";
const ROUND_SIZE = 20;
const TYPE_WEIGHTS = { EN_CN:25, CN_EN:20, DEF:25, FILL:30 };  // 出題比例
const INFL_RATE  = 0.10;   // 變化形題比例（穿插、不相鄰）
const FIX_NEEDED = 2;      // 錯題要答對幾次才算「打敗」
const OK_WAIT    = 3000;   // 答對後幾毫秒自動進下一題（NEXT 鍵隨時可按）

/* ===================== DATA =====================
   擴充新單元：在 vocabData 末尾加字、sentenceZH 加翻譯、
   inflectionData 加變化形。首頁單元選單會自動出現，不用改其他地方。
   answer：只在例句裡的形態和 word 不同時才需要（例：implanted）
   ================================================= */
const vocabData = [
  // ── F老師 Set 1 ──
  { word:"pollution", pos:"n.*", chinese:"污染",
    def:"damage to the air, water, or land caused by harmful things", defZH:"有害物質對空氣、水或土地造成的破壞",
    sentence:"Air ______ makes it hard for some people to breathe.",
    teacher:"F", unit:"Set 1" },
  { word:"species", pos:"n.", chinese:"物種",
    def:"a group of animals or plants of the same kind", defZH:"同一種類的一群動物或植物",
    sentence:"The tiger is an endangered ______.",
    teacher:"F", unit:"Set 1" },
  { word:"endangered", pos:"adj.", chinese:"瀕臨絕種的",
    def:"(of animals or plants) in danger of disappearing forever", defZH:"（動植物）有永遠消失危險的",
    sentence:"Many ______ animals live in the rainforest.",
    teacher:"F", unit:"Set 1" },
  { word:"extinct", pos:"adj.", chinese:"絕種的、滅絕的",
    def:"no longer existing anywhere in the world", defZH:"已經不存在於世界上的",
    sentence:"Dinosaurs became ______ millions of years ago.",
    teacher:"F", unit:"Set 1" },
  { word:"roam", pos:"v.", chinese:"漫遊、四處遊蕩",
    def:"to move or travel around without a clear plan", defZH:"沒有明確計畫地四處移動",
    sentence:"Wild horses ______ freely across the open fields.",
    teacher:"F", unit:"Set 1" },
  // ── F老師 Set 2 ──
  { word:"develop", pos:"v.", chinese:"發展、發育",
    def:"to grow; to become bigger and better", defZH:"成長；變得更大、更好",
    sentence:"Tadpoles ______ into frogs.",
    teacher:"F", unit:"Set 2" },
  { word:"chemical", pos:"n.", chinese:"化學物質",
    def:"a substance created by people", defZH:"由人類製造出來的物質",
    sentence:"Farmers should not use too many ______ on their crops.", answer:"chemicals",
    teacher:"F", unit:"Set 2" },
  { word:"sensitive", pos:"adj.", chinese:"敏感的",
    def:"easily affected by the things around it", defZH:"容易受周遭事物影響的",
    sentence:"It can be difficult for some people to be in very noisy places because they are ______.",
    teacher:"F", unit:"Set 2" },
  { word:"comeback", pos:"n.", chinese:"恢復、反敗為勝",
    def:"a return to a healthy state", defZH:"回到健康的狀態",
    sentence:"608 was winning the homeroom basketball tournament 20-0, until 607 made a ______ and won 20-23.",
    teacher:"F", unit:"Set 2" },
  { word:"deformed", pos:"adj.", chinese:"畸形的、變形的",
    def:"in a shape that is not normal", defZH:"形狀不正常的",
    sentence:"Pollution caused some frogs to be born with ______ legs.",
    teacher:"F", unit:"Set 2" },
  { word:"fertilizer", pos:"n.*", chinese:"肥料",
    def:"something that is added to soil to help the growth of plants", defZH:"加進土壤中幫助植物生長的東西",
    sentence:"______ is useful, but compost is safer.", answer:"Fertilizer",
    teacher:"F", unit:"Set 2" },
  { word:"native", pos:"adj.", chinese:"原生的、本土的",
    def:"belonging naturally to a specific place", defZH:"自然地屬於某個特定地方的",
    sentence:"The kudzu plant is not ______ to America, but was introduced from Japan.",
    teacher:"F", unit:"Set 2" },
  { word:"introduce", pos:"v.", chinese:"引進",
    def:"to bring a plant or animal to a place", defZH:"把植物或動物帶到某個地方",
    sentence:"The kudzu plant is not native to America, but was ______ from Japan.", answer:"introduced",
    teacher:"F", unit:"Set 2" },
  { word:"devour", pos:"v.", chinese:"狼吞虎嚥",
    def:"to eat something quickly and with a lot of energy", defZH:"快速且用力地吃東西",
    sentence:"I was so hungry after the hike that I ______ a whole pizza.", answer:"devoured",
    teacher:"F", unit:"Set 2" },
  { word:"convince", pos:"v.", chinese:"說服",
    def:"to persuade", defZH:"說服",
    sentence:"I ______ my mom to let me plant a garden.", answer:"convinced",
    teacher:"F", unit:"Set 2" },
  // ── F老師 Set 3 ──
  { word:"citizen", pos:"n.", chinese:"居民、公民",
    def:"a person who lives in a particular place", defZH:"住在某個特定地方的人",
    sentence:"The ______ of the small town welcomed the new family.", answer:"citizens",
    teacher:"F", unit:"Set 3" },
  { word:"migrate", pos:"v.", chinese:"遷徙",
    def:"to move from one habitat to another with the seasons", defZH:"隨著季節從一個棲息地移到另一個",

function tone(f, d, type="square", when=0, vol=.07){
  if (!S.sound) return; const a = ac(); if (!a) return;

  const t = a.currentTime + when; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}

/* ===================== FX ===================== */
const fx = $("#fx"), fctx = fx.getContext("2d"); let parts = [], fxOn = false;
function burst(n=140){
  const r = window.devicePixelRatio || 1; fx.width = innerWidth*r; fx.height = innerHeight*r;
  const cols = ["#ffd23f","#ff3fa4","#2ef2ff","#3cff8f","#9b5cff","#ff8a3d"];
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, sp = (4+Math.random()*11)*r;
    parts.push({x:fx.width/2, y:fx.height*.42, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-5*r, life:60+Math.random()*45, c:cols[i%cols.length], s:(4+Math.random()*6)*r, g:.28*r});
  }
  if (!fxOn){ fxOn = true; requestAnimationFrame(stepFx); }
}
function stepFx(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .98; p.life--; fctx.globalAlpha = Math.min(1, p.life/30); fctx.fillStyle = p.c; fctx.fillRect(p.x, p.y, p.s, p.s); });
  fctx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(stepFx); else { fxOn = false; fctx.clearRect(0,0,fx.width,fx.height); }
}

/* ===================== QUESTION BUILDING ===================== */
function zhTokens(v){ return v.chinese.replace(/（.*?）/g,"").split(/[、，,]/).map(x => x.replace(/…+/g,"").trim()).filter(Boolean); }
function clash(a, b){
  if (confusables.some(g => g.includes(a.word) && g.includes(b.word))) return true;
  const ta = zhTokens(a), tb = zhTokens(b);
  return ta.some(x => tb.includes(x));
}
function posGroup(p){ p = p.replace("*",""); return p.indexOf("phr") === 0 ? "phr" : p; }
function pickDistractors(v, valueOf, eligible){
  const correct = valueOf(v).toLowerCase(), seen = new Set([correct]), out = [];
  const pool = shuffle(vocabData.filter(x => x !== v && eligible(x) && !clash(v, x)));
  const same = pool.filter(x => posGroup(x.pos) === posGroup(v.pos)), other = pool.filter(x => posGroup(x.pos) !== posGroup(v.pos));
  for (const x of same.concat(other)){
    if (out.length >= 3) break;
    const val = valueOf(x); if (!val) continue;
    const k = val.toLowerCase(); if (seen.has(k)) continue;
    seen.add(k); out.push(val);
  }
  return out;
}
function fakeForms(word, inf){
  const parts = word.split(" "), head = parts[0], tail = parts.slice(1).join(" ");
  const w = x => tail ? x + " " + tail : x;
  let c = inf.form === "past"
    ? [head+"ed", head+"d", head+head.slice(-1)+"ed", head.replace(/y$/,"ied"), head.replace(/e$/,"")+"ed", head, head+"eded"]
    : [head+"s", head+"es", head.replace(/y$/,"ies"), head+head.slice(-1)+"es", head, head+"ses", head+"ss"];
  const bad = new Set([inf.inflected.toLowerCase(), ...fakeBlock]);
  const out = [];
  shuffle([...new Set(c.map(w))]).forEach(x => { if (out.length < 3 && !bad.has(x.toLowerCase()) && !out.includes(x)) out.push(x); });
  if (out.indexOf(word) < 0 && out.length === 3 && !bad.has(word.toLowerCase())) out[2] = word;  // 原形一定是一個選項
  return out;
}
function makeQuestion(word, type){
  const v = byWord[word], q = {word, type};
  if (type === "INFL" && !inflectionData[word]) type = q.type = "EN_CN";
  if (type === "EN_CN"){
    q.answer = v.chinese; q.options = shuffle([v.chinese, ...pickDistractors(v, x => x.chinese, () => true)]);
  } else if (type === "CN_EN" || type === "DEF"){
    q.answer = v.word; q.options = shuffle([v.word, ...pickDistractors(v, x => x.word, () => true)]);
  } else if (type === "FILL"){
    let valueOf = x => x.word, elig = () => true;
    if (v.form === "past" || v.form === "plural"){
      valueOf = x => (inflectionData[x.word] && inflectionData[x.word].form === v.form) ? inflectionData[x.word].inflected : null;
      elig = x => !!valueOf(x);
    }
    q.answer = v.answer.toLowerCase();
    q.options = shuffle([q.answer, ...pickDistractors(v, valueOf, elig).map(s => s.toLowerCase())]);
  } else if (type === "INFL"){
    const inf = inflectionData[word];
    q.answer = inf.inflected; q.options = shuffle([inf.inflected, ...fakeForms(word, inf)]);
  }
  return q;
}
function weightedType(exclude){
  const e = Object.entries(TYPE_WEIGHTS).filter(([t]) => t !== exclude);
  let r = Math.random() * e.reduce((a,[,w]) => a + w, 0);
  for (const [t,w] of e){ if ((r -= w) < 0) return t; }
  return e[0][0];
}
function buildQuestions(words){
  words = shuffle(words);
  const types = words.map(() => weightedType());
  const want = words.length >= 5 ? Math.max(1, Math.round(words.length * INFL_RATE)) : 0;
  const cand = shuffle(words.map((w,i) => i).filter(i => inflectionData[words[i]]));
  const chosen = [];
  for (const i of cand){ if (chosen.length >= want) break; if (chosen.some(j => Math.abs(j - i) <= 1)) continue; chosen.push(i); }
  chosen.forEach(i => types[i] = "INFL");
  return words.map((w,i) => makeQuestion(w, types[i]));
}
function spreadSameWords(items){  // 同一個字不要連續出現
  for (let pass = 0; pass < 3; pass++){
    for (let i = 1; i < items.length; i++){
      if (items[i].word === items[i-1].word){
        const j = items.findIndex((x,k) => k > i && x.word !== items[i].word && (!items[k+1] || items[k+1].word !== items[i].word) && items[k-1].word !== items[i].word);
        if (j > 0) [items[i], items[j]] = [items[j], items[i]];
      }
    }
  }
  return items;
}

/* ===================== MODES ===================== */
function selectedWords(sel){ return vocabData.filter(v => sel.includes(unitKey(v))).map(v => v.word); }
function balancedPlan(list){ const tr = Math.max(1, Math.ceil(list.length / ROUND_SIZE)); return {totalRounds:tr, size:Math.ceil(list.length / tr)}; }

function newGame(){
  const words = selectedWords(S.selected);
  if (!words.length){ toast("Pick at least one unit first!"); return; }
  if (S.current && !confirm("You have a round in progress. Start a new game anyway?")) return;
  const q = shuffle(words), b = balancedPlan(q);
  S.plan = {units:S.selected.slice(), queue:q, roundIndex:0, totalRounds:b.totalRounds, size:b.size};
  S.current = null; save(); startPlanRound();
}
function planActive(){ return S.plan && S.plan.roundIndex < S.plan.totalRounds; }
function startPlanRound(){
  const p = S.plan, words = p.queue.slice(p.roundIndex*p.size, (p.roundIndex+1)*p.size).filter(w => byWord[w]);
  beginRound("practice", buildQuestions(words), `Round ${p.roundIndex+1} / ${p.totalRounds}`);
}
function activeMistakes(){ return Object.entries(S.mistakes).filter(([w,m]) => m.active && byWord[w]); }
function startGym(onlyWords){
  let act = activeMistakes();
  if (onlyWords) act = act.filter(([w]) => onlyWords.includes(w));
  if (!act.length){ toast("No mistakes to fix — amazing! 🎉"); return; }
  const picked = shuffle(act).sort((a,b) => b[1].count - a[1].count).slice(0, ROUND_SIZE);
  const qs = shuffle(picked.map(([w,m]) => {
    let t = weightedType(m.lastType);
    if (inflectionData[w] && m.lastType !== "INFL" && Math.random() < .12) t = "INFL";
    return makeQuestion(w, t);
  }));
  beginRound("gym", qs, "💪 Mistake Gym");
}
function examItems(sel){
  const items = [];
  Object.entries(S.mistakes).forEach(([w,m]) => {
    const v = byWord[w]; if (!v || !sel.includes(unitKey(v))) return;
    Object.keys(m.types).forEach(t => { if (t === "INFL" && !inflectionData[w]) return; items.push({word:w, type:t}); });
  });
  return items;
}
function startExam(){
  const items = spreadSameWords(shuffle(examItems(S.examSel)));
  if (!items.length){ toast("No mistakes recorded in these units yet!"); return; }
  const b = balancedPlan(items);
  S.exam = {queue:items, roundIndex:0, totalRounds:b.totalRounds, size:b.size, sel:S.examSel.slice()};
  S.current = null; save(); startExamRound();
}
function examActive(){ return S.exam && S.exam.roundIndex < S.exam.totalRounds; }
function startExamRound(){
  const e = S.exam, part = e.queue.slice(e.roundIndex*e.size, (e.roundIndex+1)*e.size).filter(it => byWord[it.word]);

}

/* ---------- quiz ---------- */
function questionBody(q){
  const v = byWord[q.word];
  const spk = `<button class="spk" data-w="${esc(v.word)}" onclick="speak(this.dataset.w)">🔊</button>`;
  if (q.type === "EN_CN") return `<div class="ask">What does this word mean?</div><div class="big">${esc(v.word)}${spk}</div><div class="pos">${esc(v.pos.replace("*",""))}</div>`;
  if (q.type === "CN_EN") return `<div class="ask">Which English word matches?</div><div class="big zh">${esc(v.chinese)}</div><div class="pos">${esc(v.pos.replace("*",""))}</div>`;
  if (q.type === "DEF") return `<div class="ask">Which word matches this definition?</div><div class="def">“${esc(v.def)}”</div>
    ${q.usedHint ? `<div class="hintbox">${esc(v.defZH)}</div>` : `<button class="hint-btn" onclick="useHint()">💡 Chinese hint (half XP)</button>`}`;
  if (q.type === "FILL") return `<div class="ask">Fill in the blank.</div><div class="sent">${esc(v.sentence).replace(/______/g,'<span class="blank">?</span>')}</div><div class="zhhint">${esc(sentenceZH[v.word]||"")}</div>`;
  if (q.type === "INFL"){ const inf = inflectionData[q.word];
    return `<div class="ask">What is the <b style="color:var(--orange)">${inf.form==="past"?"PAST TENSE":"PLURAL"}</b> of…</div><div class="big">${esc(v.word)}${spk}</div><div class="pos">${esc(v.chinese)} · ${esc(inf.hint)}</div>`; }
}
function renderQuiz(){
  const c = S.current; if (!c) return renderHome();
  if (c.results.length > c.idx) return nextQ();  // 這題已作答過（按🏠或重新整理後回來）→ 直接下一題，不能重答
  const q = c.questions[c.idx], n = c.questions.length;
  c.locked = false;
  $("#quiz").innerHTML = `
    <div class="qtop"><button class="btn-sm" onclick="goHome()">🏠</button><div class="qlabel">${esc(c.label)}</div><div class="qscore">✔ ${c.score}</div></div>
    <div class="pbar"><div style="width:${c.idx/n*100}%"></div></div>
    <div class="qcount"><span>Question ${c.idx+1} / ${n}</span><span class="tag t-${q.type}">${TYPE_LABEL[q.type]}</span></div>
    <div class="card qcard">${questionBody(q)}</div>
    <div class="opts">${q.options.map((o,i) => `<button class="opt" onclick="answer(${i})">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div>`;
  show("quiz");
}
function useHint(){ const q = S.current.questions[S.current.idx]; q.usedHint = true; save(); $(".qcard").innerHTML = questionBody(q); }

const ENCOURAGE = [
  "Mistakes make your brain grow! 🌱", "Nice try! This word is now in your Mistake Gym 💪",
  "Every hero misses sometimes. You'll get it next time! 🦸", "Good effort! Read it once more and you'll remember 📖",
  "That's how learning works — keep going! 🚀", "Brave try! Beat it later for bonus XP ✨"
];
function addXP(n){ const before = levelInfo(S.xp).lv; S.xp += n; const after = levelInfo(S.xp); if (after.lv > before){ setTimeout(() => { banner("LEVEL UP!", `Level ${after.lv} · ${after.title} ${after.av}`); burst(180); SFX.level(); }, 500); } }
function answer(i){
  const c = S.current; if (!c || c.locked || c.results.length > c.idx) return; c.locked = true;
  const q = c.questions[c.idx], v = byWord[q.word];
  const ok = q.options[i].toLowerCase() === q.answer.toLowerCase();
  const W = S.words[q.word] || {s:0, c:0, w:0};
  let gain = 0, fixedNow = false;
  S.totalQ++;
  if (ok){
    W.c++; W.s = Math.min(3, W.s + 1); c.score++; c.streak++; S.totalOK++;
    gain = q.usedHint ? 5 : 10; if (c.streak >= 5) gain += 5;
    const m = S.mistakes[q.word];
    if (m && m.active){
      m.fixProgress = (m.fixProgress || 0) + 1;
      if (m.fixProgress >= FIX_NEEDED){ m.active = false; m.fixedOn = today(); S.bravery++; c.fixes++; gain += 15; fixedNow = true; }
    }
    S.bestStreak = Math.max(S.bestStreak, c.streak);
  } else {
    W.w++; W.s = Math.max(0, W.s - 1); c.streak = 0; gain = 2;
    const m = S.mistakes[q.word] || {count:0, types:{}, first:today(), active:true, fixProgress:0};
    m.count++; m.types[q.type] = (m.types[q.type] || 0) + 1; m.last = today(); m.lastType = q.type; m.active = true; m.fixProgress = 0;
    S.mistakes[q.word] = m;
  }
  S.words[q.word] = W; c.xpGain += gain; addXP(gain);
  c.results.push({word:q.word, type:q.type, ok});
  save();

  // UI
  document.querySelectorAll(".opt").forEach((b,j) => {
    const isAns = q.options[j].toLowerCase() === q.answer.toLowerCase();
    if (isAns) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); else b.classList.add("dim");
  });
  let detail = "";
  if (q.type === "FILL"){
    const full = esc(v.sentence).replace(/______/g, `<b>${esc(v.answer)}</b>`);
    detail = `<div class="fb-s">${full}</div><div class="fb-zh">${esc(sentenceZH[v.word]||"")}</div>`;
  } else if (q.type === "DEF"){
    detail = `<div class="fb-s">${esc(v.def)}</div><div class="fb-zh">${esc(v.defZH)}</div>`;
  } else if (q.type === "INFL"){
    const inf = inflectionData[q.word];
    detail = `<div class="fb-s">${esc(v.word)} → <b>${esc(inf.inflected)}</b> (${inf.form==="past"?"past tense":"plural"})</div>`;
  }
  const title = ok ? `✅ Correct! +${gain} XP` : `💡 ${ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)]}`;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"bad"}">
    <div class="fb-t">${title}</div>
    <div class="fb-w">${esc(v.word)}<i>${esc(v.pos.replace("*",""))}</i>${esc(v.chinese)}
      <button class="spk" data-w="${esc(v.word)}" onclick="speak(this.dataset.w)">🔊</button></div>
    ${detail}
    ${fixedNow ? `<div class="fb-fix">💪 MISTAKE BEATEN! +15 bonus XP</div>` : ""}
    <button id="fbNext" class="btn ${ok?"b-cont":"b-start"}" onclick="nextQ()">${c.idx+1 >= c.questions.length ? "SEE RESULTS 🏁" : "NEXT ▶"}</button>
  </div>`;
  if (!ok) setTimeout(() => $("#fb").scrollIntoView({behavior:"smooth", block:"nearest"}), 50);

  if (ok){
    SFX.ok();
    if (fixedNow){ setTimeout(SFX.fix, 200); banner("💪 BRAVE!", "Mistake beaten!"); burst(90); }
    if (c.streak % 5 === 0){ setTimeout(SFX.streak, 150); banner(STREAK_MSG[c.streak] || "🌟 LEGENDARY!", c.streak + " in a row!"); burst(160); }
    clearTimeout(window._auto); window._auto = setTimeout(() => { if (S.current === c && c.locked) nextQ(); }, fixedNow || c.streak % 5 === 0 ? OK_WAIT + 800 : OK_WAIT);
  } else SFX.bad();
  $(".qscore").textContent = "✔ " + c.score;
  updateStreak();
}
function nextQ(){
  clearTimeout(window._auto);
  const c = S.current; if (!c) return;
  c.idx++; c.locked = false; save();
  if (c.idx >= c.questions.length) finishRound(); else renderQuiz();
}
function finishRound(){
  const c = S.current, total = c.questions.length, pct = Math.round(c.score/total*100);
  let bonus = 20; if (c.score === total && total >= 5){ bonus += 30; S.perfects++; }
  c.xpGain += bonus; addXP(bonus);
  S.rounds++; if (c.mode === "exam" && pct >= 90) S.examGood++;
  const d = today(); if (!S.days.includes(d)) S.days.push(d);
  S.history.push({d:nowStr(), mode:c.mode, label:c.label, score:c.score, total});
  if (S.history.length > 100) S.history.shift();
  if (c.mode === "practice" && S.plan) S.plan.roundIndex++;
  if (c.mode === "exam" && S.exam) S.exam.roundIndex++;
  const res = Object.assign({}, c, {pct, bonus, newBadges:checkBadges()});
  S.current = null; save();
  renderResult(res);
  sendTelegram(buildReport(res), true);
}

function buildReport(r){
  const L = levelInfo(S.xp), acc = S.totalQ ? Math.round(S.totalOK/S.totalQ*100) : 0;
  const lines = ["📚 " + (S.name || "Player") + " · Word Quest Report", "🗓 " + nowStr()];
  if (r){
    lines.push("", `🎮 ${r.label.replace(/[💪🎯]\s?/g,"")}: ${r.score}/${r.questions.length} (${r.pct}%)`, `✨ +${r.xpGain} XP · 💪 beaten ${r.fixes}`);
    const miss = r.results.filter(x => !x.ok);
    if (miss.length) lines.push("❌ Missed: " + miss.map(x => `${x.word}(${byWord[x.word].chinese})[${TYPE_SHORT[x.type]}]`).join(", "));
    if (r.newBadges && r.newBadges.length) lines.push("🏆 New: " + r.newBadges.map(b => b.name).join(", "));
  }
  lines.push("", `🏅 Level ${L.lv} ${L.title} (XP ${S.xp})`, `📊 Rounds ${S.rounds} · Accuracy ${acc}% · Best streak ${S.bestStreak}`,
    `⭐ Mastered ${masteredCount()}/${vocabData.length} · 💪 Mistakes beaten ${S.bravery}`);
  const recent = S.history.slice(-5);
  if (recent.length){ lines.push("", "📝 Recent rounds:"); recent.forEach(h => lines.push(`• ${h.d} ${h.label.replace(/[💪🎯]\s?/g,"")} ${h.score}/${h.total}`)); }
  const act = activeMistakes().sort((a,b) => b[1].count - a[1].count);
  lines.push("", `💪 Still practicing (${act.length}):`);
  lines.push(act.length ? act.map(([w,m]) => `${w}(${byWord[w].chinese})×${m.count}`).join(", ") : "None 🎉");
  lines.push(`🎯 Words ever missed: ${Object.keys(S.mistakes).length}`);
  let txt = lines.join("\n"); if (txt.length > 3900) txt = txt.slice(0, 3900) + "…";
  return txt;
}
// 報告先放進 outbox（存在手機裡），送成功才移除；沒送出的下次打開或下一回合會再補送
// 每則報告有編號，轉發程式會擋掉重複的編號，所以補送不會讓 Telegram 收到兩次
function sendTelegram(text, silent){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  S.outbox = (S.outbox || []).concat([{id, text}]).slice(-20); save();
  flushOutbox(silent);
}
function flushOutbox(silent){
  if (flushOutbox.busy || !(S.outbox || []).length) return;
  flushOutbox.busy = true;
  const item = typeof S.outbox[0] === "string" ? {id:"", text:S.outbox[0]} : S.outbox[0];
  relayOnce(item.text, item.id, j => {
    flushOutbox.busy = false;
    if (j && j.ok){
      S.outbox.shift(); save();
      if (S.outbox.length) return flushOutbox(silent);
      toast("📨 Report sent!");
    } else {
      toast("⚠️ Report not sent yet (" + S.outbox.length + "). Will try again. 報告還沒送出，稍後會再試");
      console.warn("report send failed:", j && j.description);
    }
  });
}
// 先用 Apps Script 內建通道；失敗或不在 Apps Script 裡時改用網址 POST
function relayOnce(text, id, cb){
  const viaFetch = () => {
    if (!RELAY_URL) return cb({ok:false, description:"no relay url"});
    fetch(RELAY_URL, {method:"POST", body:new URLSearchParams({text, id})})
      .then(r => r.json().catch(() => ({})).then(j => cb({ok:!!(r.ok && j.ok), description:j.description || r.status})))
      .catch(e => cb({ok:false, description:"network: " + (e && e.message || e)}));
  };
  if (window.google && google.script && google.script.run){
    google.script.run.withSuccessHandler(j => j && j.ok ? cb(j) : viaFetch()).withFailureHandler(viaFetch).relay(text, id);
  } else viaFetch();
}

load();
setTimeout(() => flushOutbox(true), 3000);
if (window.speechSynthesis) speechSynthesis.getVoices();
document.addEventListener("touchstart", ac, {once:true});
renderHome();
